name: Android build and release

# Every push to main: verify (unit tests + headless smoke-play), export a
# signed APK, and publish it as a GitHub Release. Obtainium watches those
# releases and installs each new APK in place.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

env:
  GODOT_VERSION: 4.4.1
  BUILD_TOOLS: 34.0.0
  APP: shootymcbridgeface

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools build-tools;${{ env.BUILD_TOOLS }} platforms;android-34"

      - name: Cache Godot and export templates
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot-bin
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-android-v1

      - name: Install Godot and Android export templates
        if: steps.godot-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot-bin
          curl -sSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot-bin
          mv ~/godot-bin/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot-bin/godot
          chmod +x ~/godot-bin/godot
          curl -sSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dest"
          # Only the Android templates are needed; the full archive is ~1 GB.
          unzip -q /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d /tmp/tpl
          mv /tmp/tpl/templates/* "$dest/"

      - name: Verify (import, unit tests, smoke-play)
        shell: bash
        run: scripts/ci/check.sh ~/godot-bin/godot

      - name: Version
        id: ver
        shell: bash
        run: |
          base="$(tr -d '[:space:]' < VERSION)"
          echo "name=${base}.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "code=${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Point Godot at the Android SDK
        shell: bash
        run: |
          mkdir -p ~/.config/godot
          cat > ~/.config/godot/editor_settings-4.4.tres <<EOT
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          EOT

      - name: Signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ -n "${KEYSTORE_BASE64:-}" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            user="${KEY_ALIAS:-shooty}"
            pass="$KEYSTORE_PASSWORD"
            echo "Signing with the keystore from repository secrets."
          else
            cp android/dev.keystore "$RUNNER_TEMP/release.keystore"
            user="shooty"
            pass="shooty-dev"
            echo "::notice::Signing with the committed dev keystore (android/dev.keystore). See README to switch to a private key."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/release.keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$pass"
          } >> "$GITHUB_ENV"

      - name: Stamp version into export preset
        shell: bash
        run: |
          sed -i "s|^version/code=.*|version/code=${{ steps.ver.outputs.code }}|" export_presets.cfg
          sed -i "s|^version/name=.*|version/name=\"${{ steps.ver.outputs.name }}\"|" export_presets.cfg
          grep -E "^version/" export_presets.cfg

      - name: Export APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          out="build/${APP}-v${{ steps.ver.outputs.name }}.apk"
          ~/godot-bin/godot --headless --path . --export-release Android "$out" 2>&1 | tee build/export.log
          if grep -qiE "error|failed" build/export.log; then
            echo "::error::Godot reported a problem during export"; exit 1
          fi
          test -s "$out"
          echo "apk=$out" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APP }}-v${{ steps.ver.outputs.name }}
          path: ${{ env.apk }}

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          files: ${{ env.apk }}
          body: |
            Automated build of `${{ github.sha }}`.

            Install with [Obtainium](https://github.com/ImranR98/Obtainium) by adding this repository URL as an app source. See the README for details.
